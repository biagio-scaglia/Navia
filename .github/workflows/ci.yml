name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # Surfaces the cause as annotations, which are public.
            grep -iE 'error|failed|what went wrong|exception' build.log \
              | tail -20 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: navia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
